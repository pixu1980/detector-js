<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DetectorJS logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a38"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>
  <!-- radar rings -->
  <circle cx="32" cy="32" r="8"  fill="none" stroke="rgba(124,92,255,.55)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(0,229,199,.35)" stroke-width="2"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(0,229,199,.18)" stroke-width="1.5"/>
  <!-- sweep -->
  <path d="M32 32 L57.66 40.66 A24 24 0 0 0 43.31 48.31 Z" fill="url(#sweep)" opacity=".85"/>
  <line x1="32" y1="32" x2="55.5" y2="38.5" stroke="#ff5c8a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- crosshair ticks -->
  <g stroke="rgba(238,242,255,.5)" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="2.5" x2="32" y2="7"/>
    <line x1="32" y1="57" x2="32" y2="61.5"/>
    <line x1="57" y1="30" x2="61.5" y2="30"/>
    <line x1="2.5" y1="30" x2="7" y2="30"/>
  </g>
  <!-- center -->
  <circle cx="32" cy="32" r="5" fill="#7c5cff"/>
  <circle cx="32" cy="32" r="2.6" fill="#00e5c7"/>
</svg>
