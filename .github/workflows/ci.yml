name: CI

on:
  push:
    branches: [vanilla, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm types:check       # generated .d.ts compile (strict consumer)
      - run: pnpm check:size        # bundle size budget
      - run: pnpm test:coverage     # unit coverage (threshold enforced)
      - run: pnpm test              # full suite (unit + smoke + e2e)
      - run: pnpm audit --prod      # runtime deps are zero — must stay clean
      - run: pnpm pack --dry-run    # release readiness (root)
